group = simpli.fyi
version = 1.0.0

pluginRepositoryUrl = https://github.com/simpli-fyi/jetbrains-typespec-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# ADR 0002 D4 originally committed `org.gradle.java.home` here, on the stated assumption
# that this repo was single-machine. That assumption expired once the repo gained a git
# remote and CI: the path is macOS-specific and absent on GitHub runners, so committing it
# fails every CI build at daemon start. It now lives in each developer's own
# ~/.gradle/gradle.properties. CI selects its JDK via actions/setup-java (zulu 21) instead.
# The build still requires JDK 21 - the platform tooling does not support this machine's
# default JDK 26.
