group = simpli.fyi
version = 0.0.1

pluginRepositoryUrl = https://github.com/nathalie-mk-ua/intellij-tsp-plugin

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# ADR 0002 D4: pin the Gradle daemon's JDK to Zulu 21. The system default JDK on this
# machine is 26 (Oracle), which the IntelliJ Platform Gradle Plugin / JBR do not support.
# This is a machine-specific absolute path; the repo is currently single-machine so it is
# committed here per ADR 0002 D4's M0 default. Verified present via `/usr/libexec/java_home -V`.
org.gradle.java.home = /Library/Java/JavaVirtualMachines/zulu-21.jdk/Contents/Home
